<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourtReserve Watcher</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-title-group">
    <img src="icon.png" class="app-icon" alt="CourtReserve Watcher" width="36" height="36">
    <div class="header-text">
      <h1>CourtReserve Watcher</h1>
      <span id="status" class="last-updated">Checking updates...</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="user-name-wrap">
      <span id="userNameDisplay" class="user-welcome">
        <span class="material-symbols-outlined" style="font-size:18px;">person</span>
        <span class="welcome-text">Welcome, <b id="welcomeName"></b></span>
        <span class="material-symbols-outlined edit-name-btn" title="Edit name">edit</span>
      </span>
      <span id="userNameInputWrap" class="user-input-wrap">
        <span class="material-symbols-outlined" style="font-size:18px;">person</span>
        <input type="text" id="userNameInput" class="user-name-input" placeholder="Your CourtReserve name" autocomplete="off" title="Enter your name as it appears on CourtReserve to see your registration status">
        <span class="material-symbols-outlined user-name-saved" id="userNameCheck" style="display:none;">check_circle</span>
      </span>
    </div>
  </div>
</header>

<main id="app">
  <div style="text-align:center; padding: 40px; color: var(--md-on-surface-variant);">
    Loading events data...
  </div>
</main>

<script src="app.js" defer></script>
<script>
if ('serviceWorker' in navigator) {
  // Only reload when this page was already running under a worker: on a first visit the page
  // starts uncontrolled, and claiming it would otherwise trigger a pointless reload.
  const controlledOnLoad = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!controlledOnLoad || window.__swReloading) return;
    window.__swReloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    // updateViaCache:'none' keeps sw.js itself out of the HTTP cache; update() forces a check.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then((reg) => reg.update())
      .catch(() => {});
  });
}
</script>

<!-- Court availability timeline modal -->
<div id="courtsModal" class="courts-modal-overlay" onclick="if (event.target === this) closeCourtsModal()">
  <div class="courts-modal" role="dialog" aria-modal="true" aria-labelledby="courtsModalTitle">
    <div class="courts-modal-head">
      <div class="courts-modal-heading">
        <h2 id="courtsModalTitle">Court availability</h2>
        <span id="courtsModalSub" class="courts-modal-sub"></span>
      </div>
      <button type="button" class="courts-modal-close" onclick="closeCourtsModal()" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="courts-modal-legend">
      <span class="cl-item"><span class="cl-swatch free"></span> Open</span>
      <span class="cl-item"><span class="cl-swatch booked"></span> Booked</span>
      <span class="cl-item"><span class="cl-swatch now"></span> Now</span>
      <a class="cl-link" href="https://app.courtreserve.com/Online/Reservations/Bookings/17397?sId=22028" target="_blank" rel="noopener">
        <span class="material-symbols-outlined" style="font-size:13px">open_in_new</span> Book on CourtReserve
      </a>
    </div>
    <div id="courtsModalBody" class="courts-modal-body"></div>
  </div>
</div>

<!-- Name prompt overlay -->
<div id="namePrompt" class="prompt-overlay">
  <div class="prompt-card">
    <span class="material-symbols-outlined prompt-icon">person</span>
    <h2>Welcome!</h2>
    <p>Enter your name as it appears on CourtReserve to see your registration status across all events.</p>
    <input type="text" id="promptNameInput" class="prompt-input" placeholder="Your CourtReserve name..." autocomplete="off">
    <div class="prompt-actions">
      <button id="promptDismiss" class="prompt-btn secondary">Don't ask again</button>
      <button id="promptSave" class="prompt-btn primary">Save</button>
    </div>
  </div>
</div>
</body>
</html>

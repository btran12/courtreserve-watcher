<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourtReserve Watcher</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-title-group">
    <img src="icon.png" class="app-icon" alt="CourtReserve Watcher" width="36" height="36">
    <div class="header-text">
      <h1>CourtReserve Watcher</h1>
      <span id="status" class="last-updated">Checking updates...</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="user-name-wrap">
      <span class="material-symbols-outlined" style="font-size:18px; color:var(--md-on-surface-variant);">person</span>
      <input type="text" id="userNameInput" class="user-name-input" placeholder="Your CourtReserve name" autocomplete="off" title="Enter your as it appears on CourtReserve to see your registration status">
      <span class="material-symbols-outlined user-name-saved" id="userNameCheck" style="display:none;">check_circle</span>
    </div>
    <a href="https://app.courtreserve.com/Online/Calendar/Events/17397/Day" target="_blank" rel="noopener noreferrer" class="header-btn" title="Open CourtReserve" aria-label="Open CourtReserve">
      <span class="material-symbols-outlined">open_in_new</span>
      <span class="btn-label">CourtReserve</span>
    </a>
    <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">
      <span class="material-symbols-outlined">refresh</span>
    </button>
  </div>
</header>

<main id="app">
  <div style="text-align:center; padding: 40px; color: var(--md-on-surface-variant);">
    Loading events data...
  </div>
</main>

<script src="app.js" defer></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourtReserve Watcher</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-title-group">
    <span class="material-symbols-outlined app-icon">sports_tennis</span>
    <div class="header-text">
      <h1>CourtReserve Watcher</h1>
      <span id="status" class="last-updated">Checking updates...</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="user-name-wrap">
      <span class="material-symbols-outlined" style="font-size:18px; color:var(--md-on-surface-variant);">person</span>
      <input type="text" id="userNameInput" class="user-name-input" placeholder="Your name" autocomplete="off" title="Enter your name to see your registration status">
      <span class="material-symbols-outlined user-name-saved" id="userNameCheck" style="display:none;">check_circle</span>
    </div>
    <a href="https://app.courtreserve.com/Online/Calendar/Events/17397/Day" target="_blank" rel="noopener noreferrer" class="header-btn" title="Open CourtReserve" aria-label="Open CourtReserve">
      <span class="material-symbols-outlined">open_in_new</span>
      <span class="btn-label">CourtReserve</span>
    </a>
    <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">
      <span class="material-symbols-outlined">refresh</span>
    </button>
  </div>
</header>

<main id="app">
  <div style="text-align:center; padding: 40px; color: var(--md-on-surface-variant);">
    Loading events data...
  </div>
</main>

<!-- Event Details & Activity Modal Pop-up -->
<div id="eventModal" class="modal-overlay" onclick="handleBackdropClick(event)" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-window">
    <div class="modal-header">
      <div class="modal-title-group">
        <h2 class="modal-title" id="modalTitle">Event Details</h2>
        <div class="modal-subtitle" id="modalSubtitle">Date & Time</div>
      </div>
      <div class="modal-header-actions">
        <a id="modalCrLink" href="https://app.courtreserve.com/Online/Calendar/Events/17397/Day" target="_blank" rel="noopener noreferrer" class="header-btn" title="Open in CourtReserve">
          <span class="material-symbols-outlined">open_in_new</span>
          <span class="btn-label">CourtReserve</span>
        </a>
        <button class="modal-close-btn" onclick="closeSlotModal()" aria-label="Close dialog">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    
    <div class="modal-summary-bar" id="modalBadges"></div>

    <div class="modal-tab-nav">
      <button id="modalTabBtnActivity" class="modal-tab-btn active" onclick="setModalTab('activity')">
        <span class="material-symbols-outlined">history</span> Activity History <span class="tab-count-badge" id="modalActivityBadge">0</span>
      </button>
      <button id="modalTabBtnRoster" class="modal-tab-btn" onclick="setModalTab('roster')">
        <span class="material-symbols-outlined">group</span> Participants Roster <span class="tab-count-badge" id="modalRosterBadge">0</span>
      </button>
    </div>

    <div class="modal-body">
      <!-- Activity Tab Content -->
      <div id="modalTabActivity">
        <div id="modalActivityList"></div>
      </div>

      <!-- Roster Tab Content -->
      <div id="modalTabRoster" style="display: none;">
        <div class="search-wrap">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="modalSearchInput" class="search-input-box" placeholder="Search participants..." oninput="filterModalRoster(this.value)">
        </div>
        <div class="modal-roster-grid">
          <div class="box-container">
            <div class="box-title" id="modalRegTitle">
              <span class="material-symbols-outlined" style="font-size:16px; color:#2e7d32">group</span> Registered
            </div>
            <div id="modalRegList"></div>
          </div>
          <div class="box-container">
            <div class="box-title" id="modalWaitTitle">
              <span class="material-symbols-outlined" style="font-size:16px; color:#ed6c02">hourglass_empty</span> Waitlist
            </div>
            <div id="modalWaitList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
